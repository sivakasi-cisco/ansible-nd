- name: ND vPC pair replace tests
  hosts: nd
  gather_facts: false
  tasks:
    ##############################################
    ##                 SETUP                    ##
    ##############################################

    - name: REPLACE - Test Entry Point - [nd_vpc_pair]
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "+         Executing Replace Tests - [nd_vpc_pair]             +"
          - "----------------------------------------------------------------"
      tags: replace

    ##############################################
    ##      Setup Internal TestCase Variables  ##
    ##############################################

    - name: REPLACE - Setup Internal TestCase Variables
      ansible.builtin.set_fact:
        deploy_local: true
        test_fabric: "{{ fabric_name }}"
        test_switch1: "{{ switch1_serial }}"
        test_switch2: "{{ switch2_serial }}"
        test_fabric_type: "{{ fabric_type | default('LANClassic') }}"
        test_data_replaced:
          vpc_pair_initial_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
          vpc_pair_replaced_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: false
      tags: replace

    ##############################################
    ##                REPLACE                  ##
    ##############################################

    # TC1 - Create initial vPC pair using replace state
    - name: REPLACE - TC1 - DELETE - Clean up any existing vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      tags: replace

    - name: REPLACE - TC1 - REPLACE - Create vPC pair using replace state
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: replaced
        config: "{{ test_data_replaced.vpc_pair_initial_conf }}"
      register: result
      tags: replace

    - name: REPLACE - TC1 - ASSERT - Check if changed flag is true
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: replace

    - name: REPLACE - TC1 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: replace

    - name: REPLACE - TC1 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: replace

    # TC2 - Replace vPC pair configuration
    - name: REPLACE - TC2 - REPLACE - Replace vPC pair configuration
      cisco.nd.nd_vpc_pair: &conf_replaced
        fabric_name: "{{ test_fabric }}"
        state: replaced
        config: "{{ test_data_replaced.vpc_pair_replaced_conf }}"
      register: result
      tags: replace

    - name: REPLACE - TC2 - ASSERT - Check if changed flag is true for LANClassic
      ansible.builtin.assert:
        that:
          - result.failed == false
      when: test_fabric_type == "LANClassic"
      tags: replace

    - name: REPLACE - TC2 - ASSERT - Check if changed flag is false for VXLANFabric
      ansible.builtin.assert:
        that:
          - result.failed == false
      when: test_fabric_type == "VXLANFabric"
      tags: replace

    - name: REPLACE - TC2 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: replace

    - name: REPLACE - TC2 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
          - verify_result.gathered.vpc_pairs[0].useVirtualPeerLink == false
      when: test_fabric_type == "LANClassic"
      tags: replace

    # TC3 - Idempotence test
    - name: REPLACE - TC3 - conf - Idempotence
      cisco.nd.nd_vpc_pair: *conf_replaced
      register: result
      tags: replace

    - name: REPLACE - TC3 - ASSERT - Check if changed flag is false
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.failed == false
      tags: replace

    ##############################################
    ##                 CLEAN-UP                 ##
    ##############################################

    - name: REPLACE - END - remove vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      when: cleanup_at_end | default(true)
      tags: replace
