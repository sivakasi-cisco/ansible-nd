- name: ND vPC pair merged tests
  hosts: nd
  gather_facts: false
  tasks:
    ##############################################
    ##                 SETUP                    ##
    ##############################################

    - name: MERGED - Test Entry Point - [nd_vpc_pair]
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "+          Executing Merged Tests - [nd_vpc_pair]              +"
          - "----------------------------------------------------------------"
      tags: merged

    ##############################################
    ##      Setup Internal TestCase Variables  ##
    ##############################################

    - name: MERGED - Setup Internal TestCase Variables
      ansible.builtin.set_fact:
        deploy_local: false
        test_fabric: "{{ fabric_name }}"
        test_switch1: "{{ switch1_serial }}"
        test_switch2: "{{ switch2_serial }}"
        test_fabric_type: "{{ fabric_type | default('LANClassic') }}"
        test_data_merged:
          vpc_pair_full_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
          vpc_pair_full_deployed_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
          vpc_pair_modified_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: false
          vpc_pair_minimal_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
          vpc_pair_no_deploy_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
      tags: merged

    - name: MERGED - Change deploy to true
      ansible.builtin.set_fact:
        deploy_local: true
      tags: merged

    ##############################################
    ##                MERGED                    ##
    ##############################################

    # TC1 - Create vPC pair with full configuration
    - name: MERGED - TC1 - DELETED - Clean up any existing vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      tags: merged

    - name: MERGED - TC1 - MERGED - Create vPC pair with full configuration
      cisco.nd.nd_vpc_pair: &conf_full
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_merged.vpc_pair_full_conf }}"
      register: result
      tags: merged

    - name: MERGED - TC1 - ASSERT - Check if changed flag is true
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: merged

    - name: MERGED - TC1 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: merged

    - name: MERGED - TC1 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: merged

    - name: MERGED - TC1 - conf - Idempotence
      cisco.nd.nd_vpc_pair: *conf_full
      register: result
      tags: merged

    - name: MERGED - TC1 - ASSERT - Check if changed flag is false
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: merged

    # TC2 - Modify existing vPC pair configuration
    - name: MERGED - TC2 - MERGED - Modify vPC pair configuration
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_merged.vpc_pair_modified_conf }}"
      register: result
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC2 - ASSERT - Check if changed flag is true
      ansible.builtin.assert:
        that:
          - result.failed == false
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC2 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC2 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
          - verify_result.gathered.vpc_pairs[0].useVirtualPeerLink == false
      when: test_fabric_type == "LANClassic"
      tags: merged

    # TC2b - VXLANFabric specific test
    - name: MERGED - TC2b - MERGED - Merge vPC pair for VXLAN fabric
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      when: test_fabric_type == "VXLANFabric"
      tags: merged

    - name: MERGED - TC2b - ASSERT - Check if changed flag is false for VXLAN
      ansible.builtin.assert:
        that:
          - result.failed == false
      when: test_fabric_type == "VXLANFabric"
      tags: merged

    - name: MERGED - TC2b - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
      register: verify_result
      when: test_fabric_type == "VXLANFabric"
      tags: merged

    # TC3 - Delete vPC pair
    - name: MERGED - TC3 - DELETED - Delete vPC pair
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      tags: merged

    - name: MERGED - TC3 - ASSERT - Check if deleted successfully
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: merged

    - name: MERGED - TC3 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: merged

    - name: MERGED - TC3 - ASSERT - Verify vPC pair deletion
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 0'
      tags: merged

    # TC4 - Create vPC pair with minimal configuration
    - name: MERGED - TC4 - MERGED - Create vPC pair with minimal configuration
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_merged.vpc_pair_minimal_conf }}"
      register: result
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC4 - ASSERT - Check if changed flag is true
      ansible.builtin.assert:
        that:
          - result.failed == false
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC4 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC4 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      when: test_fabric_type == "LANClassic"
      tags: merged

    # TC4b - Delete vPC pair after minimal test
    - name: MERGED - TC4b - DELETED - Delete vPC pair after minimal test
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      when: test_fabric_type == "LANClassic"
      tags: merged

    - name: MERGED - TC4b - ASSERT - Check if deleted successfully
      ansible.builtin.assert:
        that:
            - result.failed == false
      when: test_fabric_type == "LANClassic"
      tags: merged

    # TC5 - Create vPC pair with defaults (state omitted)
    - name: MERGED - TC5 - MERGED - Create vPC pair with defaults
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        config: "{{ test_data_merged.vpc_pair_minimal_conf }}"
      register: result
      tags: merged

    - name: MERGED - TC5 - ASSERT - Check if changed flag is true
      ansible.builtin.assert:
        that:
            - result.failed == false
      tags: merged

    - name: MERGED - TC5 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: merged

    - name: MERGED - TC5 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: merged

    # TC5b - Delete vPC pair after defaults test
    - name: MERGED - TC5b - DELETED - Delete vPC pair after defaults test
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      tags: merged

    - name: MERGED - TC5b - ASSERT - Check if deleted successfully
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: merged

    # TC6 - Create vPC pair with deploy flag false
    - name: MERGED - TC6 - MERGED - Create vPC pair with deploy false
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        deploy: false
        config: "{{ test_data_merged.vpc_pair_no_deploy_conf }}"
      register: result
      tags: merged

    - name: MERGED - TC6 - ASSERT - Check if changed flag is true and no deploy
      ansible.builtin.assert:
        that:
          - result.failed == false
          - result.deployment is not defined
      tags: merged

    - name: MERGED - TC6 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: merged

    - name: MERGED - TC6 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: merged

    # TC7 - Test invalid configurations
    - name: MERGED - TC7 - MERGED - Create vPC pair with invalid peer switch
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config:
          - peer1_switch_id: "INVALID_SERIAL"
            peer2_switch_id: "{{ test_switch2 }}"
            use_virtual_peer_link: true
      register: result
      ignore_errors: true
      tags: merged

    - name: MERGED - TC7 - ASSERT - Check invalid peer switch error
      ansible.builtin.assert:
        that:
          - result.failed == false or result.msg is defined
      tags: merged

    ##############################################
    ##                 CLEAN-UP                 ##
    ##############################################

    - name: MERGED - END - remove vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      when: cleanup_at_end | default(true)
      tags: merged
