- name: ND vPC pair query tests
  hosts: nd
  gather_facts: false
  tasks:
    ##############################################
    ##                 SETUP                    ##
    ##############################################

    - name: QUERY - Test Entry Point - [nd_vpc_pair]
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "+          Executing Query Tests - [nd_vpc_pair]               +"
          - "----------------------------------------------------------------"
      tags: query

    ##############################################
    ##      Setup Internal TestCase Variables  ##
    ##############################################

    - name: QUERY - Setup Internal TestCase Variables
      ansible.builtin.set_fact:
        deploy_local: true
        test_fabric: "{{ fabric_name }}"
        test_switch1: "{{ switch1_serial }}"
        test_switch2: "{{ switch2_serial }}"
        test_data_query:
          vpc_pair_setup_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
      tags: query

    ##############################################
    ##                QUERY                     ##
    ##############################################

    # TC1 - Setup: Create vPC pair for query tests
    - name: QUERY - TC1 - DELETED - Clean up any existing vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      tags: query

    - name: QUERY - TC1 - MERGED - Create vPC pair for testing
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_query.vpc_pair_setup_conf }}"
      register: result
      tags: query

    - name: QUERY - TC1 - ASSERT - Check if creation successful
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: query

    - name: QUERY - TC1 - QUERY - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
      register: verify_result
      tags: query

    - name: QUERY - TC1 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: query

    # TC2 - Query with no filters
    - name: QUERY - TC2 - QUERY - Query all vPC pairs with no filters
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
      register: result
      tags: query

    - name: QUERY - TC2 - ASSERT - Check query results
      ansible.builtin.assert:
        that:
          - result.failed == false
          - '(result.gathered.vpc_pairs | length) == 1'
      tags: query

    # TC3 - Query with both peers specified
    - name: QUERY - TC3 - QUERY - Query vPC pair with both peers specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      tags: query

    - name: QUERY - TC3 - ASSERT - Check query results with both peers
      ansible.builtin.assert:
        that:
          - result.failed == false
          - '(result.gathered.vpc_pairs | length) == 1'
      tags: query

    # TC4 - Query with one peer specified (not supported in nd_vpc_pair)
    - name: QUERY - TC4 - QUERY - Query vPC pair with one peer specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
      register: result
      ignore_errors: true
      tags: query

    - name: QUERY - TC4 - ASSERT - Verify partial peer query is rejected
      ansible.builtin.assert:
        that:
          - result.failed == false or result.msg is defined
      tags: query

    # TC5 - Query with second peer specified (not supported in nd_vpc_pair)
    - name: QUERY - TC5 - QUERY - Query vPC pair with second peer specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer2_switch_id: "{{ test_switch2 }}"
      register: result
      ignore_errors: true
      tags: query

    - name: QUERY - TC5 - ASSERT - Verify partial peer query is rejected
      ansible.builtin.assert:
        that:
          - result.failed == false or result.msg is defined
      tags: query

    # TC6 - Query with non-existent peer
    - name: QUERY - TC6 - QUERY - Query vPC pair with non-existent peer
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "INVALID_SERIAL"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      ignore_errors: true
      tags: query

    - name: QUERY - TC6 - ASSERT - Check query results with non-existent peer
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: query

    ##############################################
    ##                 CLEAN-UP                 ##
    ##############################################

    - name: QUERY - END - remove vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      when: cleanup_at_end | default(true)
      tags: query
