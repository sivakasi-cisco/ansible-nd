- name: ND vPC pair gather tests
  hosts: nd
  gather_facts: false
  tasks:
    ##############################################
    ##                 SETUP                    ##
    ##############################################

    - name: GATHER - Test Entry Point - [nd_vpc_pair]
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "+          Executing Gather Tests - [nd_vpc_pair]               +"
          - "----------------------------------------------------------------"
      tags: gather

    ##############################################
    ##      Setup Internal TestCase Variables  ##
    ##############################################

    - name: GATHER - Setup Internal TestCase Variables
      ansible.builtin.set_fact:
        deploy_local: true
        test_fabric: "{{ fabric_name }}"
        test_switch1: "{{ switch1_serial }}"
        test_switch2: "{{ switch2_serial }}"
        test_data_query:
          vpc_pair_setup_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
      tags: gather

    ##############################################
    ##                GATHER                     ##
    ##############################################

    # TC1 - Setup: Create vPC pair for gather tests
    - name: GATHER - TC1 - DELETE - Clean up any existing vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      tags: gather

    - name: GATHER - TC1 - MERGE - Create vPC pair for testing
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_query.vpc_pair_setup_conf }}"
      register: result
      tags: gather

    - name: GATHER - TC1 - ASSERT - Check if creation successful
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: gather

    - name: GATHER - TC1 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        state: gathered
        fabric_name: "{{ test_fabric }}"
      register: verify_result
      tags: gather

    - name: GATHER - TC1 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: gather

    # TC2 - Gather with no filters
    - name: GATHER - TC2 - GATHER - Gather all vPC pairs with no filters
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
      register: result
      tags: gather

    - name: GATHER - TC2 - ASSERT - Check gather results
      ansible.builtin.assert:
        that:
          - result.failed == false
          - '(result.gathered.vpc_pairs | length) == 1'
      tags: gather

    # TC3 - Gather with both peers specified
    - name: GATHER - TC3 - GATHER - Gather vPC pair with both peers specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      tags: gather

    - name: GATHER - TC3 - ASSERT - Check gather results with both peers
      ansible.builtin.assert:
        that:
          - result.failed == false
          - '(result.gathered.vpc_pairs | length) == 1'
      tags: gather

    # TC4 - Gather with one peer specified (not supported in nd_vpc_pair)
    - name: GATHER - TC4 - GATHER - Gather vPC pair with one peer specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
      register: result
      ignore_errors: true
      tags: gather

    - name: GATHER - TC4 - ASSERT - Verify partial peer gather is rejected
      ansible.builtin.assert:
        that:
          - result.failed == true
          - result.msg is defined
      tags: gather

    # TC5 - Gather with second peer specified (not supported in nd_vpc_pair)
    - name: GATHER - TC5 - GATHER - Gather vPC pair with second peer specified
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer2_switch_id: "{{ test_switch2 }}"
      register: result
      ignore_errors: true
      tags: gather

    - name: GATHER - TC5 - ASSERT - Verify partial peer gather is rejected
      ansible.builtin.assert:
        that:
          - result.failed == true
          - result.msg is defined
      tags: gather

    # TC6 - Gather with non-existent peer
    - name: GATHER - TC6 - GATHER - Gather vPC pair with non-existent peer
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "INVALID_SERIAL"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      ignore_errors: true
      tags: gather

    - name: GATHER - TC6 - ASSERT - Check gather results with non-existent peer
      ansible.builtin.assert:
        that:
          - result.failed == false
      tags: gather

    ##############################################
    ##                 CLEAN-UP                 ##
    ##############################################

    - name: GATHER - END - remove vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      when: cleanup_at_end | default(true)
      tags: gather
