- name: ND vPC pair delete tests
  hosts: nd
  gather_facts: false
  tasks:
    ##############################################
    ##                 SETUP                    ##
    ##############################################

    - name: DELETE - Test Entry Point - [nd_vpc_pair]
      ansible.builtin.debug:
        msg:
          - "----------------------------------------------------------------"
          - "+         Executing Delete Tests - [nd_vpc_pair]              +"
          - "----------------------------------------------------------------"
      tags: delete

    ##############################################
    ##      Setup Internal TestCase Variables  ##
    ##############################################

    - name: DELETE - Setup Internal TestCase Variables
      ansible.builtin.set_fact:
        deploy_local: true
        test_fabric: "{{ fabric_name }}"
        test_switch1: "{{ switch1_serial }}"
        test_switch2: "{{ switch2_serial }}"
        test_data_deleted:
          vpc_pair_setup_conf:
            - peer1_switch_id: "{{ switch1_serial }}"
              peer2_switch_id: "{{ switch2_serial }}"
              use_virtual_peer_link: true
      tags: delete

    ##############################################
    ##                DELETE                   ##
    ##############################################

    # TC1 - Setup: Create vPC pair for deletion tests
    - name: DELETE - TC1 - DELETE - Clean up any existing vPC pairs
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      tags: delete

    - name: DELETE - TC1 - MERGE - Create vPC pair for deletion testing
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_deleted.vpc_pair_setup_conf }}"
      register: result
      tags: delete

    - name: DELETE - TC1 - ASSERT - Check if creation successful
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.failed == false
      tags: delete

    - name: DELETE - TC1 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: delete

    - name: DELETE - TC1 - ASSERT - Verify vPC pair state in ND
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: delete

    # TC2 - Delete vPC pair with specific config
    - name: DELETE - TC2 - DELETE - Delete vPC pair with specific peer config
      cisco.nd.nd_vpc_pair: &delete_specific
        fabric_name: "{{ test_fabric }}"
        state: deleted
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: result
      tags: delete

    - name: DELETE - TC2 - ASSERT - Check if deletion successful
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.failed == false
      tags: delete

    - name: DELETE - TC2 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: delete

    - name: DELETE - TC2 - ASSERT - Verify vPC pair deletion
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 0'
      tags: delete

    # TC3 - Idempotence test for deletion
    - name: DELETE - TC3 - conf - Idempotence
      cisco.nd.nd_vpc_pair: *delete_specific
      register: result
      tags: delete

    - name: DELETE - TC3 - ASSERT - Check if changed flag is false
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.failed == false
      tags: delete

    # TC4 - Create another vPC pair for bulk deletion test
    - name: DELETE - TC4 - MERGE - Create vPC pair for bulk deletion testing
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: merged
        config: "{{ test_data_deleted.vpc_pair_setup_conf }}"
      register: result
      tags: delete

    - name: DELETE - TC4 - ASSERT - Check if creation successful
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.failed == false
      tags: delete

    - name: DELETE - TC4 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
        config:
          - peer1_switch_id: "{{ test_switch1 }}"
            peer2_switch_id: "{{ test_switch2 }}"
      register: verify_result
      tags: delete

    - name: DELETE - TC4 - ASSERT - Verify vPC pair state in ND for bulk deletion setup
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 1'
      tags: delete

    # TC5 - Delete all vPC pairs without specific config
    - name: DELETE - TC5 - DELETE - Delete all vPC pairs without specific config
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      register: result
      tags: delete

    - name: DELETE - TC5 - ASSERT - Check if bulk deletion successful
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.failed == false
      tags: delete

    - name: DELETE - TC5 - GATHER - Get vPC pair state in ND
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: gathered
      register: verify_result
      tags: delete

    - name: DELETE - TC5 - ASSERT - Verify bulk deletion
      ansible.builtin.assert:
        that:
          - verify_result.failed == false
          - '(verify_result.gathered.vpc_pairs | length) == 0'
      tags: delete

    # TC6 - Delete from empty fabric (should be no-op)
    - name: DELETE - TC6 - DELETE - Delete from empty fabric (no-op)
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      register: result
      tags: delete

    - name: DELETE - TC6 - ASSERT - Check if no change occurred
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.failed == false
      tags: delete

    ##############################################
    ##                 CLEAN-UP                 ##
    ##############################################

    - name: DELETE - END - ensure clean state
      cisco.nd.nd_vpc_pair:
        fabric_name: "{{ test_fabric }}"
        state: deleted
      when: cleanup_at_end | default(true)
      tags: delete
